name: Compile Grit APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for the git rev-parse commit hash task in build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew :androidApp:assembleFossDebug --stacktrace

      - name: Upload Grit APK
        uses: actions/upload-artifact@v4
        with:
          name: Grit-J7Prime-APK
          path: androidApp/build/outputs/apk/foss/debug/*.apk
